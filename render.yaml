services:
  - type: web
    name: vpn-relay
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/render-relay/Dockerfile
    dockerContext: ./docker/render-relay
    healthCheckPath: /__health
    envVars:
      - key: ORIGIN_ADDR
        sync: false
      - key: ORIGIN_SNI
        sync: false
