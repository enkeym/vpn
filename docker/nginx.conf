# ВНИМАНИЕ: это шаблон. docker-entrypoint.sh подставляет сюда значения из .env
# и кладёт результат в /etc/nginx/nginx.conf. Правится только этот файл.

# stream в Alpine собран отдельным пакетом (nginx-mod-stream) — подключаем явно.
load_module modules/ngx_stream_module.so;

worker_processes 1;
pid /run/nginx.pid;
# В stdout/stderr — чтобы логи попадали в docker logs, а не в файл внутри контейнера.
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

# Внешний порт слушает stream, а НЕ http: по SNI из ClientHello (ssl_preread,
# без расшифровки) трафик разводится между двумя каналами обхода. Только так оба
# канала живут на одном стандартном 443 — а Reality на нестандартном порту сам
# Xray считает риском («Listening on non-443 ports may get your IP blocked»).
stream {
  map $ssl_preread_server_name $vpn_upstream {
    # Домен CDN — это релей пришёл на origin. Отдаём в http-сервер ниже,
    # он терминирует TLS публичным сертификатом домена. Источник не проверяем:
    # адреса исходящих у платформы релея меняются, а канал и так закрыт
    # UUID клиента и случайным WS-путём.
    "__XRAY_DOMAIN__"  127.0.0.1:__TLS_PORT__;
    # Всё остальное (SNI маскировочного сайта, мусор, активные зонды) — в
    # Reality. Он сам разберётся: клиент с валидным ключом идёт в VLESS, чужой
    # прозрачно проксируется на realitySettings.dest с настоящим сертификатом.
    default          127.0.0.1:__REALITY_PORT__;
  }

  server {
    # Только IPv4: клиентские ссылки содержат IPv4-литерал сервера, а CDN
    # ходит на origin тоже по IPv4 (AAAA-записи у домена нет). Слушать [::] здесь
    # нечем оправдать, зато на хосте без IPv6 это была бы ошибка старта nginx.
    listen __PUBLIC_PORT__;
    ssl_preread on;
    # PROXY protocol в обе ветки: без него и Xray, и http-сервер видели бы
    # 127.0.0.1 вместо реального клиента. На стороне Reality этому соответствует
    # tcpSettings.acceptProxyProtocol, на стороне http — listen ... proxy_protocol.
    proxy_protocol on;
    proxy_pass $vpn_upstream;
    # Длинные соединения VPN не должны рваться по таймауту прокси.
    proxy_timeout 3600s;
  }
}

http {
  access_log off;
  client_max_body_size 0;

  server {
    # Только localhost: наружу этот канал отдаёт stream-сервер выше.
    listen 127.0.0.1:__TLS_PORT__ ssl proxy_protocol;

    ssl_certificate     /app/configs/cdn-cert.pem;
    ssl_certificate_key /app/configs/cdn-key.pem;

    # Реальный IP приходит из PROXY protocol от собственного stream-сервера.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    # Подписка — единственный путь NestJS, который обязан быть публичным.
    # /peers и /metrics/ намеренно НЕ проксируем: они закрыты ключами, но
    # публиковать внутреннее API через CDN незачем — с хоста оно и так на
    # localhost:__APP_PORT__.
    location /sub/ { proxy_pass http://127.0.0.1:__APP_PORT__; }

    # Корень отдаёт NestJS: на домен будут заходить и люди, и сканеры, а домен,
    # который на всё молчит, сам по себе приметен. Пусть видят обычный ответ.
    location = / { proxy_pass http://127.0.0.1:__APP_PORT__; }

    # Всё остальное — VLESS+WS на Xray. Путь WS случайный и лежит в
    # configs/xray-ws.json, сюда попадает по фолбэку; сам путь проверяет Xray.
    location / {
      proxy_pass http://127.0.0.1:__WS_PORT__;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      # Xray шлёт WS-heartbeat раз в 30с (wsSettings.heartbeatPeriod), поэтому
      # живое соединение не должно закрываться по нашему таймауту: рвать его
      # раньше, чем это сделает CDN, — значит воспроизводить ту же проблему
      # своими руками.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  # __STEAL_BEGIN__ — блок вырезается entrypoint'ом, если XRAY_INTERNAL_STEAL_PORT пуст.
  # Self-steal: сайт-маска Reality живёт у нас же (XRAY_REALITY_DEST=127.0.0.1:порт).
  # ТСПУ на мобильном режет ClientHello с SNI российского сайта, пришедший на
  # зарубежный IP хостера; со своим доменом SNI, DNS и сертификат указывают на
  # этот же IP, и несоответствия нет. Сюда ходит только сам Reality: зонды и
  # клиенты без ключа получают настоящий сертификат нашего домена.
  server {
    # Без proxy_protocol: Reality шлёт на dest с xver 0. Наружу не слушает —
    # публичный 443 у stream, а SNI этого домена уходит по default в Reality.
    listen 127.0.0.1:__STEAL_PORT__ ssl;
    # Reality требует от dest TLS 1.3 и h2 — как у обычного современного сайта.
    http2 on;
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_certificate     /app/configs/steal-cert.pem;
    ssl_certificate_key /app/configs/steal-key.pem;

    # Корень — тот же ответ NestJS, что и на CDN-домене: сайт, который на всё
    # молчит, приметен. /sub/ и внутреннее API здесь не публикуем.
    location = / { proxy_pass http://127.0.0.1:__APP_PORT__; }
    location / { return 404; }
  }
  # __STEAL_END__
}
