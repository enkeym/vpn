# ВНИМАНИЕ: это шаблон — docker-entrypoint.sh подставляет __XRAY_DOMAIN__ из
# .env и кладёт результат в /etc/nginx/nginx.conf. Правь только этот файл.

# stream собран как динамический модуль (см. `nginx -V`), поэтому подключаем явно.
load_module modules/ngx_stream_module.so;

worker_processes 1;

events {
  worker_connections 1024;
}

# Внешний 443 слушает stream, а не http: по SNI из ClientHello (ssl_preread,
# без расшифровки) трафик разводится между двумя каналами обхода. Это позволяет
# держать Reality именно на 443 — Xray сам предупреждает, что «Listening on
# non-443 ports may get your IP blocked by the GFW»: TLS на нестандартном порту
# для DPI отдельный маркер, и мобильные операторы режут такое в первую очередь.
stream {
  map $ssl_preread_server_name $vpn_upstream {
    # Домен CDN — это Cloudflare ходит на origin, отдаём в http-сервер ниже,
    # он терминирует TLS сертификатом Cloudflare Origin CA.
    __XRAY_DOMAIN__  127.0.0.1:8444;
    # Всё остальное (SNI маскировочного сайта, мусор, активные зонды) — в
    # Reality. Он сам решит: клиент с валидным ключом идёт в VLESS, чужой —
    # прозрачно проксируется на realitySettings.dest с настоящим сертификатом.
    default          127.0.0.1:8443;
  }

  server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    # PROXY protocol v1 в обе стороны развязки: без него Xray и nginx видели бы
    # 127.0.0.1 вместо клиента, и лимит устройств (getOnlineIps) считал бы всех
    # одним IP. На стороне Reality соответствует xver:1, на стороне http —
    # listen ... proxy_protocol + real_ip_header.
    proxy_protocol on;
    proxy_pass $vpn_upstream;
    # Длинные соединения VPN не должны рваться по таймауту прокси.
    proxy_timeout 3600s;
  }
}

http {
  access_log off;
  client_max_body_size 0;

  server {
    # Только localhost: наружу этот канал отдаёт stream-сервер выше.
    listen 127.0.0.1:8444 ssl proxy_protocol;

    ssl_certificate     /app/configs/cloudflare-cert.pem;
    ssl_certificate_key /app/configs/cloudflare-key.pem;

    # Реальный IP приходит из PROXY protocol от собственного stream-сервера.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    # NestJS: health/metrics/внутреннее API/подписка sing-box (см. src/main.ts,
    # порт 3000 — фиксированное значение по умолчанию, совпадает с PORT в .env).
    location = / { proxy_pass http://127.0.0.1:3000; }
    location = /health { proxy_pass http://127.0.0.1:3000; }
    location /metrics/ { proxy_pass http://127.0.0.1:3000; }
    location /peers { proxy_pass http://127.0.0.1:3000; }
    location /sub/ { proxy_pass http://127.0.0.1:3000; }

    # Всё остальное — VLESS+WS на Xray (см. XrayService.internalWsPort).
    # Путь WS случайный и меняется при ротации — сюда попадает по фолбэку,
    # сам путь Xray проверяет уже внутри себя.
    location / {
      proxy_pass http://127.0.0.1:8880;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      # Xray шлёт WS-heartbeat раз в 30с (wsSettings.heartbeatPeriod), поэтому
      # живое соединение не должно закрываться по нашему таймауту: рвать его
      # раньше CDN — значит воспроизводить ту же проблему своими руками.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
