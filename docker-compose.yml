services:
  vpn-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: vpn-bot:latest
    pull_policy: build
    container_name: vpn-tgbot
    restart: unless-stopped
    init: true

    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    # network_mode: host — контейнер живёт в сетевом пространстве хоста напрямую,
    # без docker'овского bridge/DNAT (убирает двойной NAT для трафика туннеля).
    # Из-за этого:
    #  1. sysctls ниже (были net.ipv4.ip_forward / net.ipv6.conf.all.*) docker
    #     в host-режиме применять к контейнеру не даёт — их нужно один раз
    #     выставить на самом хосте, см. «Команды на сервере» в docs/scaling.md.
    #  2. Секция ports (была ниже) в host-режиме не работает — контейнер сразу
    #     слушает AWG_PORT на хосте. Публичный AWG_PUBLIC_PORT (4500) без
    #     докеровского проброса нужно перенаправлять iptables REDIRECT на хосте,
    #     см. docs/scaling.md.
    network_mode: host

    deploy:
      resources:
        limits:
          # 12.08.2026: сервер расширен до 4 ядер / 7.8Gi RAM (nproc/docker info
          # подтверждены после restart docker — демон кэшировал старое NumCPU
          # с последнего перезапуска 04.08). Лимит — 3.0/2G, не 4.0/весь RAM:
          # ядро и часть памяти нужны хосту под ОС, sshd, conntrack, cron.
          # docker откажется стартовать контейнер, если cpus больше числа ядер
          # хоста — при следующем апгрейде поднимать значения синхронно с nproc.
          # Полный список шагов апгрейда: docs/scaling.md
          cpus: '3.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M

    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - /lib/modules:/lib/modules:ro

    # Проброса портов больше нет (network_mode: host — контейнер слушает AWG_PORT
    # напрямую на хосте). Проброс AWG_PUBLIC_PORT (4500) → AWG_PORT (51821) и
    # открытие обоих портов в фаерволе теперь делаются на хосте вручную,
    # см. «Команды на сервере» в docs/scaling.md.
    #
    # Второй канал (VLESS через Xray) слушает здесь же, на хосте:
    #  • XRAY_REALITY_PORT (443/tcp) — публичный, открыть в фаерволе. Именно
    #    443: TLS на нестандартном порту DPI режет в первую очередь, поэтому
    #    прокси для Telegram уведён на 8443, а не наоборот;
    #  • XRAY_SOCKS_PORT (8443/tcp) — публичный SOCKS5 для Telegram, открыть в
    #    фаерволе; поднимается только при XRAY_SOCKS_ENABLED=true;
    #  • XRAY_INTERNAL_WS_PORT (8880) и XRAY_STATS_API_PORT (8881) — только
    #    127.0.0.1, наружу их не публикуем: WS отдаёт хостовой reverse-proxy.
    # Раскладка и конфиг прокси — в README, раздел «Второй канал: VLESS (Xray)».

    env_file:
      - .env

    dns:
      - 1.1.1.1
      - 8.8.8.8

    stop_grace_period: 30s
