services:
  vpn-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: vpn-bot:latest
    pull_policy: build
    container_name: vpn-tgbot
    restart: unless-stopped
    init: true

    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    # network_mode: host — контейнер живёт в сетевом пространстве хоста напрямую,
    # без docker'овского bridge/DNAT (убирает двойной NAT для трафика туннеля).
    # Из-за этого:
    #  1. sysctls ниже (были net.ipv4.ip_forward / net.ipv6.conf.all.*) docker
    #     в host-режиме применять к контейнеру не даёт — их нужно один раз
    #     выставить на самом хосте: `sudo make bootstrap` (scripts/bootstrap-host.sh).
    network_mode: host

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - /lib/modules:/lib/modules:ro

    env_file:
      - .env

    dns:
      - 1.1.1.1
      - 8.8.8.8

    stop_grace_period: 30s
