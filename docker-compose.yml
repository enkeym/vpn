services:
  vpn-bot:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - vpn-new-bot:latest
    image: vpn-new-bot:latest
    container_name: vpn-tgbot
    restart: unless-stopped
    init: true

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    volumes:
      - ./configs:/app/configs
      - ./data:/app/data

    ports:
      # nginx — терминирует TLS, разводит /sub (NestJS) и VLESS+WS (Xray) по пути
      - '${XRAY_PORT:-443}:${XRAY_PORT:-443}/tcp'
      # VLESS + Reality — прямой TCP на IP сервера, без CDN (см. XrayService)
      - '${REALITY_PORT:-8443}:${REALITY_PORT:-8443}/tcp'
      # Hysteria2 (QUIC/UDP) — прямой канал против блокировки самого Cloudflare
      - '${HYSTERIA_PORT:-8443}:${HYSTERIA_PORT:-8443}/udp'
      # Опционально: health check порт (если нужен внешний доступ)
      # - '3000:3000'

    env_file:
      - .env

    dns:
      - 1.1.1.1
      - 8.8.8.8

    stop_grace_period: 30s
