services:
  vpn-bot:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - vpn-bot:latest
    image: vpn-bot:latest
    container_name: vpn-tgbot
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - /lib/modules:/lib/modules:ro

    ports:
      - '${WG_PORT:-51820}:51820/udp'
      # Опционально: health check порт (если нужен внешний доступ)
      # - '3000:3000'

    env_file:
      - .env

    dns:
      - 1.1.1.1
      - 8.8.8.8

    stop_grace_period: 30s
