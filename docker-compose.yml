services:
  vpn-bot:
    build: .
    container_name: vpn-bot
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs:/app/configs
      - /lib/modules:/lib/modules:ro
    ports:
      - '${WG_PORT:-51820}:51820/udp'
    env_file:
      - .env
